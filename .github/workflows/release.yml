name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Install dependencies
        run: cd toolknit-desktop && npm ci

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest
          $version = $release.tag_name.TrimStart('v')
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/v$version/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-temp -Force
          New-Item -ItemType Directory -Path toolknit-desktop/src-tauri/resources/ffmpeg -Force | Out-Null
          Copy-Item ffmpeg-temp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe toolknit-desktop/src-tauri/resources/ffmpeg/ffmpeg.exe -Force

      - name: Build Tauri
        run: cd toolknit-desktop && npm run tauri build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: toolknit-desktop/src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
