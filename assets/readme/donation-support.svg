<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 820" role="img" aria-labelledby="title desc">
  <title id="title">ToolKnit donation support artwork placeholder</title>
  <desc id="desc">A clean placeholder for the final ToolKnit donation artwork, with two reserved QR code areas.</desc>
  <rect width="2400" height="820" fill="#ffffff"/>
  <path d="M140 620 C420 190 690 190 980 500 S1530 760 2260 190" fill="none" stroke="#172033" stroke-width="8"/>
  <path d="M180 650 C500 290 700 270 1010 530 S1590 790 2240 260" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="18 20"/>
  <g fill="#172033">
    <circle cx="470" cy="300" r="18"/><circle cx="980" cy="500" r="18"/><circle cx="1510" cy="675" r="18"/><circle cx="2030" cy="360" r="18"/>
  </g>
  <g fill="#ffffff" stroke="#172033" stroke-width="5">
    <rect x="210" y="115" width="390" height="390" rx="12"/>
    <rect x="1800" y="315" width="390" height="390" rx="12"/>
  </g>
  <g fill="#475569" font-family="Arial, 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="1200" y="165" font-size="58" font-weight="700" letter-spacing="3">TOOLKNIT · SUPPORT THE WORK</text>
    <text x="405" y="555" font-size="30">支付宝二维码区域</text>
    <text x="1995" y="755" font-size="30">微信二维码区域</text>
    <text x="1200" y="735" font-size="28">将最终 AI 设计图替换为同一路径即可</text>
  </g>
  <g fill="none" stroke="#172033" stroke-width="7" stroke-linecap="round">
    <path d="M1110 445 C1150 405 1190 405 1230 445 C1270 485 1310 485 1350 445"/>
    <path d="M1160 390 L1135 350 M1210 390 L1210 340 M1260 390 L1285 350"/>
  </g>
</svg>
