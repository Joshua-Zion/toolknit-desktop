<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controls</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      background: transparent;
      -webkit-app-region: no-drag;
    }
    .btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #777;
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.16);
      color: #111;
    }
    .btn.close:hover {
      background: #e81123;
      color: #fff;
    }
  </style>
</head>
<body>
  <button class="btn" id="btn-min" title="Minimize">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="btn" id="btn-max" title="Maximize">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
  </button>
  <button class="btn close" id="btn-close" title="Close">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>

  <script type="module">
    import { getCurrentWindow } from '@tauri-apps/api/window';
    import { WebviewWindow } from '@tauri-apps/api/webviewWindow';

    async function getMain() {
      return await WebviewWindow.getByLabel('main');
    }

    const maxSvg = '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>';
    const restoreSvg = '<rect x="5" y="9" width="10" height="10" rx="1" ry="1"/><rect x="9" y="3" width="10" height="10" rx="1" ry="1"/>';

    document.getElementById('btn-min')?.addEventListener('click', async () => {
      const main = await getMain();
      if (main) await main.minimize();
    });

    const maxBtn = document.getElementById('btn-max');
    maxBtn?.addEventListener('click', async () => {
      const main = await getMain();
      if (main) await main.toggleMaximize();
    });

    document.getElementById('btn-close')?.addEventListener('click', async () => {
      const main = await getMain();
      if (main) await main.close();
    });

    // 监听主窗口最大化状态变化
    const selfWin = getCurrentWindow();
    selfWin.listen('tauri://resize', async () => {
      const main = await getMain();
      if (main && maxBtn) {
        const isMax = await main.isMaximized();
        maxBtn.querySelector('svg').innerHTML = isMax ? restoreSvg : maxSvg;
        maxBtn.title = isMax ? 'Restore' : 'Maximize';
      }
    });
  </script>
</body>
</html>
