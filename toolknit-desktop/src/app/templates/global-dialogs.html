<div class="audio-convert-success-overlay dependency-gate-overlay" id="dependencyGateOverlay" aria-hidden="true">
      <div class="audio-convert-success-dialog dependency-gate-dialog" role="dialog" aria-modal="true" aria-labelledby="dependencyGateTitle">
        <div class="dependency-gate-icon"><i data-lucide="download"></i></div>
        <h3 class="audio-convert-success-title" id="dependencyGateTitle" data-i18n="home.dependencies.title">需要补齐本地依赖</h3>
        <p class="audio-convert-success-meta" id="dependencyGateDesc" data-i18n="home.dependencies.desc">安装完成后即可进入当前功能，依赖也可以随时在设置中管理。</p>
        <div class="audio-convert-success-detail dependency-gate-list" id="dependencyGateList"></div>
        <div class="dependency-gate-progress" id="dependencyGateProgress" hidden>
          <div class="dependency-gate-progress-track"><span id="dependencyGateProgressFill"></span></div>
          <span id="dependencyGateProgressText"></span>
        </div>
        <p class="dependency-gate-error" id="dependencyGateError" role="alert" hidden></p>
        <div class="audio-convert-success-actions">
          <button class="audio-convert-success-btn audio-convert-success-btn-secondary" id="dependencyGateCancel" type="button" data-i18n="home.dependencies.cancel">取消</button>
          <button class="audio-convert-success-btn audio-convert-success-btn-primary" id="dependencyGateInstall" type="button" data-i18n="home.dependencies.installAll">开始下载全部依赖</button>
        </div>
      </div>
    </div>
